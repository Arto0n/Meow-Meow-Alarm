name: Publish Android preview APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          python3 - <<'PYCHECK'
          import os, re
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          config = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          match = re.search(r'versionName\s*=\s*"([^"]+)"', config)
          if not match:
              raise SystemExit('versionName was not found in app/build.gradle.kts')
          version = match.group(1)
          if not re.fullmatch(r'v[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:-[A-Za-z0-9.-]+)?', tag):
              raise SystemExit(f'Invalid release tag: {tag}')
          if tag != 'v' + version:
              raise SystemExit(f'Tag {tag} does not match app versionName={version}')
          print('Validated version:', version)
          PYCHECK

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify sources
        run: python3 tests/verify_sources.py

      - name: Build installable preview APK
        run: gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/MeowMeowAlarm-${GITHUB_REF_NAME}-preview.apk"
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists; not overwriting it."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.apk release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Meow Meow Alarm $GITHUB_REF_NAME (Preview)" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease \
            --verify-tag

